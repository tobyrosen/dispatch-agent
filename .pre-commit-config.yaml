
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: [--fix, --disable, MD013, MD033, MD041, "--"]

  - repo: https://github.com/crate-ci/typos
    rev: v1.28.4
    hooks:
      - id: typos
        args: [--write-changes]
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright (Python type check, staged files only)
        entry: pyright
        language: node
        additional_dependencies: ["pyright@1.1.410"]
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or:
          [javascript, jsx, ts, tsx, json, css, scss, markdown, yaml, html]
        additional_dependencies:
          - prettier@3.4.2
          - prettier-plugin-astro@0.14.1

  - repo: local
    hooks:
      - id: eslint
        name: eslint (JS/TS lint)
        entry: npx --no-install eslint --fix
        language: system
        types_or: [javascript, jsx, ts, tsx]
        require_serial: true

  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: bash -c 'if [ -f src-tauri/Cargo.toml ] && [ ! -f Cargo.toml ]; then cd src-tauri; fi; cargo fmt --all --check'
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy
        name: clippy
        entry: bash -c 'if [ -f src-tauri/Cargo.toml ] && [ ! -f Cargo.toml ]; then cd src-tauri; fi; cargo clippy --all-targets -- -W warnings'
        language: system
        types: [rust]
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - chore
          - docs
          - test
          - refactor
          - perf
          - ci
          - build
          - style
          - revert
